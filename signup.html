<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up | CodeBuddy</title>
  <link rel="stylesheet" href="signup.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="signup-container">
    <div class="signup-card">
      <img src="logo.png" alt="Code Buddy Logo" class="logo" />
      <h2>Create Your CodeBuddy Account</h2>

      <form id="signupForm">
        <div class="form-group">
          <label for="name">👤 Name</label>
          <input type="text" id="name" name="name" required placeholder="Enter your full name" />
          <small class="error-message" id="nameError"></small>
        </div>

        <div class="form-group">
          <label for="email">📧 Email</label>
          <input type="email" id="email" name="email" required placeholder="Enter your email" />
          <small class="error-message" id="emailError"></small>
        </div>

        <div class="form-group">
          <label for="password">🔒 Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" name="password" required placeholder="Create a password" />
            <button type="button" class="toggle-password" onclick="togglePassword('password')">👁</button>
          </div>
          <small class="error-message" id="passwordError"></small>
        </div>

        <div class="form-group">
          <label for="confirmPassword">🔒 Confirm Password</label>
          <div class="password-wrapper">
            <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Confirm your password" />
            <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword')">👁</button>
          </div>
          <small class="error-message" id="confirmError"></small>
        </div>

        <button type="submit" class="signup-btn">Sign Up</button>
        <p class="login-link">Already have an account? <a href="login.html">Login here</a></p>
      </form>
    </div>
  </div>

  <script src="signup.js"></script>
</body>
</html>
